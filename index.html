<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday! ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="intro-page">

    <!-- Galaxy background -->
    <div class="galaxy">
        <div class="stars stars-one"></div>
        <div class="stars stars-two"></div>
        <div class="stars stars-three"></div>

        <div class="nebula nebula-one"></div>
        <div class="nebula nebula-two"></div>

        <div class="shooting-star shooting-one"></div>
        <div class="shooting-star shooting-two"></div>
    </div>

    <!-- Floating decorative hearts -->
    <div class="floating-heart heart-one">♥</div>
    <div class="floating-heart heart-two">♡</div>
    <div class="floating-heart heart-three">♥</div>
    <div class="floating-heart heart-four">✦</div>

    <!-- Main intro frame -->
    <main class="intro-wrapper">

        <section class="intro-frame">

            <div class="pixel-corner corner-top-left"></div>
            <div class="pixel-corner corner-top-right"></div>
            <div class="pixel-corner corner-bottom-left"></div>
            <div class="pixel-corner corner-bottom-right"></div>

            <div class="player-label">
                ♥ PLAYER 1 ♥
            </div>

            <!-- Pixel cake -->
            <div class="cake">
                <div class="candle candle-one">
                    <span></span>
                </div>

                <div class="candle candle-two">
                    <span></span>
                </div>

                <div class="candle candle-three">
                    <span></span>
                </div>

                <div class="cake-top"></div>
                <div class="cake-middle"></div>
                <div class="cake-bottom"></div>
            </div>

            <p class="intro-small">
                A LITTLE BIRTHDAY GREETING
            </p>

            <p class="intro-small">
                MADE JUST FOR YOU
            </p>

            <h1>
                HAPPY<br>
                BIRTHDAY!
            </h1>

            <div class="name-box">
                LEA MY BABY
            </div>

            <p class="intro-description">
                NEVER GROW OLD??♡
            </p>

            <button id="startButton" class="pixel-button">
                <span>START</span>
                <span class="button-arrow">▶</span>
            </button>

            <p class="press-start">
                PRESS TO BEGIN
            </p>

            <div class="intro-stars">
                <span>✦</span>
                <span>✧</span>
                <span>⋆</span>
                <span>✦</span>
                <span>♡</span>
            </div>  

        </section>

    </main>

    <!-- Music -->
    <audio id="birthdayAudio" preload="auto">
        <source src="assets/audio/birthday-song.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
